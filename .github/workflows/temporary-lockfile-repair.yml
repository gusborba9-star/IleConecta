name: Temporary npm lockfile repair (AUDIT-01)

on:
  push:
    branches:
      - cto/repository-audit-vercel-foundation

permissions:
  contents: write

jobs:
  synchronize-lockfile:
    if: github.ref == 'refs/heads/cto/repository-audit-vercel-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Regenerate npm lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): synchronize npm lockfile"
          git push origin HEAD:cto/repository-audit-vercel-foundation
